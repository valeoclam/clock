<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全屏时钟</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            /* 【黑色背景】 */
            background-color: #000; 
            touch-action: none; 
            overflow: hidden;
        }
        #clock {
            /* 【白色字体】 */
            color: #ffffff; 
            /* 【加粗字体】 Impact 字体本身就很粗 */
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-weight: 900;
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            white-space: nowrap;
            width: 100%;
            font-size: 100px; 
            letter-spacing: -5px;
            user-select: none;
            cursor: default;
        }
    </style>
</head>
<body>
    <div id="clock"></div>

    <script>
        var clockElement = document.getElementById("clock");
        var currentFontSize = 100;
        var initialPinchDistance = null;
        var initialFontSize = null;

        // I. 核心时钟功能
        function updateClock() {
            var now = new Date();
            var hours = now.getHours();
            var minutes = now.getMinutes();
            hours = (hours < 10 ? "0" : "") + hours;
            minutes = (minutes < 10 ? "0" : "") + minutes;
            clockElement.innerHTML = hours + ":" + minutes;
        }
        
        function adjustFontSize() {
            var screenWidth = window.innerWidth;
            var screenHeight = window.innerHeight;
            currentFontSize = Math.min(screenWidth * 0.25, screenHeight * 0.95);
            clockElement.style.fontSize = currentFontSize + "px";
        }

        // II. 手势缩放功能 (Pinch-to-Zoom)
        function getDistance(touches) {
            if (touches.length < 2) return null;
            var dx = touches[0].pageX - touches[1].pageX;
            var dy = touches[0].pageY - touches[1].pageY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        document.addEventListener('touchstart', function(event) {
            if (event.touches.length === 2) {
                event.preventDefault(); 
                initialPinchDistance = getDistance(event.touches);
                var currentSizeStr = window.getComputedStyle(clockElement).fontSize;
                initialFontSize = parseFloat(currentSizeStr);
            }
        }, { passive: false });

        document.addEventListener('touchmove', function(event) {
            if (event.touches.length === 2 && initialPinchDistance !== null) {
                event.preventDefault(); 
                var currentPinchDistance = getDistance(event.touches);

                if (currentPinchDistance > 0 && initialPinchDistance > 0) {
                    var scale = currentPinchDistance / initialPinchDistance;
                    currentFontSize = initialFontSize * scale;
                    
                    if (currentFontSize < 30) currentFontSize = 30;
                    if (currentFontSize > window.innerHeight * 1.5) currentFontSize = window.innerHeight * 1.5;

                    clockElement.style.fontSize = currentFontSize + "px";
                }
            }
        }, { passive: false });

        document.addEventListener('touchend', function(event) {
            if (event.touches.length < 2) { 
                initialPinchDistance = null;
                initialFontSize = null;
            }
        });


        // III. 运行和初始化
        setInterval(updateClock, 60000); 

        function preventScreenLock() {
            var currentScroll = window.scrollY;
            window.scrollTo(0, currentScroll === 0 ? 1 : 0);
        }
        setInterval(preventScreenLock, 10000);

        adjustFontSize();
        updateClock();
        window.onresize = adjustFontSize;
    </script>
</body>
</html>
