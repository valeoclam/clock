<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fliqlo Universal</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
            -webkit-user-select: none; user-select: none;
        }
        #main-container {
            display: table; width: 100%; height: 100%;
            position: relative; top: 0px; left: 0px; z-index: 5;
        }
        .clock-wrapper { display: table-cell; vertical-align: middle; text-align: center; }

        .card {
            display: inline-block; background-color: #1a1a1a;
            border-radius: 6px; width: 22vw; height: 60vw;
            margin: 0 1%; position: relative; overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }

        .num-text {
            position: absolute; width: 100%; height: 100%;
            top: 0; left: 0; color: #dcdcdc;
            font-family: "Impact", "HelveticaNeue-CondensedBold", sans-serif;
            font-size: 50vw; line-height: 60vw; text-align: center;
            -webkit-transform: scaleX(0.75); transform: scaleX(0.75);
        }

        .card:after {
            content: ""; position: absolute; top: 50%; left: 0;
            width: 100%; height: 2px; background: #000;
            z-index: 10; margin-top: -1px;
        }

        /* 强制置顶控制面板 */
        #ctrl-panel {
            position: fixed !important; 
            bottom: 5%; left: 0; width: 100%;
            text-align: center; z-index: 999999 !important; 
            display: none;
        }
        .btn {
            display: inline-block; width: 45px; height: 40px;
            line-height: 40px; background: #2c2c2c;
            border: 1px solid #666; color: #fff; border-radius: 4px;
            margin: 4px; font-size: 13px; font-family: sans-serif;
            -webkit-appearance: none;
        }
    </style>
</head>
<body id="body">

    <div id="main-container">
        <div class="clock-wrapper">
            <div class="card"><div class="num-text" id="h1">0</div></div>
            <div class="card"><div class="num-text" id="h2">0</div></div>
            <div class="card"><div class="num-text" id="m1">0</div></div>
            <div class="card"><div class="num-text" id="m2">0</div></div>
        </div>
    </div>

    <div id="ctrl-panel">
        <div class="btn" onclick="adj('size', 2)">字+</div>
        <div class="btn" onclick="adj('size', -2)">字-</div>
        <div class="btn" onclick="adj('width', 2)">宽+</div>
        <div class="btn" onclick="adj('width', -2)">宽-</div>
        <div class="btn" onclick="adj('height', 2)">高+</div>
        <div class="btn" onclick="adj('height', -2)">高-</div>
        <br>
        <div class="btn" onclick="adj('offset', -2)">字←</div>
        <div class="btn" onclick="adj('offset', 2)">字→</div>
        <div class="btn" onclick="changeWeight()">粗细</div>
        <div class="btn" onclick="adj('y', -10)">屏↑</div>
        <div class="btn" onclick="adj('y', 10)">屏↓</div>
        <div class="btn" onclick="resetConfig()" style="background:#800">重置</div>
    </div>

    <script type="text/javascript">
        var state = { size: 50, width: 22, height: 60, x: 0, y: 0, offset: 0, wIndex: 2 };
        var weights = [100, 400, 700, 900];

        function loadSettings() {
            try {
                var saved = localStorage.getItem('fliqlo_v4');
                if (saved) {
                    var parsed = JSON.parse(saved);
                    for (var key in parsed) { state[key] = parsed[key]; }
                }
            } catch (e) {}
            applyAll();
        }

        function saveSettings() {
            try {
                localStorage.setItem('fliqlo_v4', JSON.stringify(state));
            } catch (e) {}
        }

        function updateTime() {
            var now = new Date();
            var h = ("0" + now.getHours()).slice(-2);
            var m = ("0" + now.getMinutes()).slice(-2);
            document.getElementById("h1").innerHTML = h.charAt(0);
            document.getElementById("h2").innerHTML = h.charAt(1);
            document.getElementById("m1").innerHTML = m.charAt(0);
            document.getElementById("m2").innerHTML = m.charAt(1);
        }

        function adj(type, val) {
            if(window.event) window.event.stopPropagation();
            state[type] += val;
            applyAll();
            saveSettings();
        }

        function changeWeight() {
            if(window.event) window.event.stopPropagation();
            state.wIndex = (state.wIndex + 1) % weights.length;
            applyAll();
            saveSettings();
        }

        function applyAll() {
            var unit = (window.innerWidth > window.innerHeight) ? "vh" : "vw";
            var cards = document.getElementsByClassName("card");
            var nums = document.getElementsByClassName("num-text");
            for(var i=0; i<4; i++) {
                cards[i].style.width = state.width + unit;
                cards[i].style.height = state.height + unit;
                nums[i].style.fontSize = state.size + unit;
                nums[i].style.lineHeight = state.height + unit;
                nums[i].style.left = state.offset + "px";
                nums[i].style.fontWeight = weights[state.wIndex];
            }
            document.getElementById("main-container").style.top = state.y + "px";
        }

        function resetConfig() {
            if(window.event) window.event.stopPropagation();
            localStorage.removeItem('fliqlo_v4');
            window.location.reload();
        }

        // 统一点击唤起函数
        function toggleControls(e) {
            var p = document.getElementById("ctrl-panel");
            // 如果点击的是按钮本身，不关闭面板
            if (e.target.className.indexOf('btn') !== -1) return;
            p.style.display = (p.style.display == "block") ? "none" : "block";
        }

        // 绑定到 window 确保 Safari 捕获点击
        window.onclick = toggleControls;

        window.onload = function() {
            loadSettings();
            setInterval(updateTime, 1000);
            updateTime();
        };
    </script>
</body>
</html>
