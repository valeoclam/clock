<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fliqlo Safari Fix</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
            /* 解决 Safari 点击高亮色 */
            -webkit-tap-highlight-color: rgba(0,0,0,0);
        }
        
        #main-container {
            display: table; width: 100%; height: 100%;
            position: relative; z-index: 100;
        }
        .clock-wrapper { display: table-cell; vertical-align: middle; text-align: center; }

        .card {
            display: inline-block; background-color: #1a1a1a;
            border-radius: 6px; width: 22vw; height: 60vw;
            margin: 0 1%; position: relative; overflow: hidden;
            /* 强制硬件加速以适配 iPhone 4s */
            -webkit-transform: translateZ(0);
        }

        .num-text {
            position: absolute; width: 100%; height: 100%;
            top: 0; left: 0; color: #dcdcdc;
            font-family: "Impact", sans-serif;
            font-size: 50vw; line-height: 60vw; text-align: center;
            -webkit-transform: scaleX(0.75); transform: scaleX(0.75);
        }

        .card:after {
            content: ""; position: absolute; top: 50%; left: 0;
            width: 100%; height: 2px; background: #000; z-index: 10;
        }

        /* 控制面板：针对 Safari 强化的样式 */
        #ctrl-panel {
            position: fixed !important; 
            bottom: 30px; left: 0; width: 100%;
            text-align: center; 
            z-index: 2147483647 !important; /* 最高的层级 */
            display: none;
            background: rgba(0,0,0,0.6); /* 稍微加点背景方便看清 */
            padding: 10px 0;
        }
        
        .btn {
            display: inline-block; width: 45px; height: 40px;
            line-height: 40px; background: #333;
            border: 1px solid #777; color: #fff; border-radius: 4px;
            margin: 4px; font-size: 13px; font-family: sans-serif;
            -webkit-appearance: none; /* 禁用系统默认按钮样式 */
            cursor: pointer;
        }
    </style>
</head>
<body id="page-body">

    <div id="main-container">
        <div class="clock-wrapper">
            <div class="card"><div class="num-text" id="h1">0</div></div>
            <div class="card"><div class="num-text" id="h2">0</div></div>
            <div class="card"><div class="num-text" id="m1">0</div></div>
            <div class="card"><div class="num-text" id="m2">0</div></div>
        </div>
    </div>

    <div id="ctrl-panel">
        <div class="btn" onclick="adj('size', 2)">字+</div>
        <div class="btn" onclick="adj('size', -2)">字-</div>
        <div class="btn" onclick="adj('width', 2)">宽+</div>
        <div class="btn" onclick="adj('width', -2)">宽-</div>
        <div class="btn" onclick="adj('height', 2)">高+</div>
        <div class="btn" onclick="adj('height', -2)">高-</div>
        <br>
        <div class="btn" onclick="adj('offset', -2)">字←</div>
        <div class="btn" onclick="adj('offset', 2)">字→</div>
        <div class="btn" onclick="changeWeight()">粗细</div>
        <div class="btn" onclick="adj('y', -10)">屏↑</div>
        <div class="btn" onclick="adj('y', 10)">屏↓</div>
        <div class="btn" onclick="resetConfig()" style="background:#800">重置</div>
    </div>

    <script type="text/javascript">
        var state = { size: 50, width: 22, height: 60, x: 0, y: 0, offset: 0, wIndex: 2 };
        var weights = [100, 400, 700, 900];

        function loadSettings() {
            try {
                var saved = localStorage.getItem('fliqlo_final_v1');
                if (saved) {
                    var parsed = JSON.parse(saved);
                    for (var key in parsed) { state[key] = parsed[key]; }
                }
            } catch (e) {}
            applyAll();
        }

        function saveSettings() {
            try {
                localStorage.setItem('fliqlo_final_v1', JSON.stringify(state));
            } catch (e) {}
        }

        function updateTime() {
            var now = new Date();
            var h = ("0" + now.getHours()).slice(-2);
            var m = ("0" + now.getMinutes()).slice(-2);
            document.getElementById("h1").innerText = h.charAt(0);
            document.getElementById("h2").innerText = h.charAt(1);
            document.getElementById("m1").innerText = m.charAt(0);
            document.getElementById("m2").innerText = m.charAt(1);
        }

        function adj(type, val) {
            // 禁止事件向上传递
            if(window.event) window.event.cancelBubble = true;
            state[type] += val;
            applyAll();
            saveSettings();
        }

        function changeWeight() {
            if(window.event) window.event.cancelBubble = true;
            state.wIndex = (state.wIndex + 1) % weights.length;
            applyAll();
            saveSettings();
        }

        function applyAll() {
            var unit = (window.innerWidth > window.innerHeight) ? "vh" : "vw";
            var cards = document.getElementsByClassName("card");
            var nums = document.getElementsByClassName("num-text");
            for(var i=0; i<4; i++) {
                cards[i].style.width = state.width + unit;
                cards[i].style.height = state.height + unit;
                nums[i].style.fontSize = state.size + unit;
                nums[i].style.lineHeight = state.height + unit;
                nums[i].style.left = state.offset + "px";
                nums[i].style.fontWeight = weights[state.wIndex];
            }
            document.getElementById("main-container").style.top = state.y + "px";
        }

        function resetConfig() {
            if(window.event) window.event.cancelBubble = true;
            localStorage.removeItem('fliqlo_final_v1');
            window.location.reload();
        }

        // 统一唤起/隐藏面板
        function handleMenu(e) {
            var p = document.getElementById("ctrl-panel");
            var target = e.target || e.srcElement;
            // 如果点到按钮了，不隐藏
            if (target.className.indexOf('btn') !== -1) return;
            
            p.style.display = (p.style.display === "block") ? "none" : "block";
        }

        // 同时监听 Click 和 TouchStart 以适配 Safari
        document.addEventListener('touchstart', function(e) {
            // 防止双击缩放干扰
            if (e.touches.length > 1) return;
            // 处理逻辑
            var target = e.target;
            if (target.className.indexOf('btn') === -1) {
                handleMenu(e);
            }
        }, false);

        // PC端保留 click
        document.addEventListener('click', function(e) {
            handleMenu(e);
        }, false);

        window.onload = function() {
            loadSettings();
            setInterval(updateTime, 1000);
            updateTime();
        };
    </script>
</body>
</html>
