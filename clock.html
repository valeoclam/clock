<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>手机全屏时钟</title>
    <style>
        /* --- 通用基础样式 --- */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #000;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* --- 样式 A: 可控制时钟 (默认样式) --- */
        #clockA {
            color: #ffffff;
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-weight: 900;
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            -ms-transform: translate(-50%, -50%);
            white-space: nowrap;
            width: 100%;
            letter-spacing: -5px;
            box-sizing: border-box;
            user-select: none;
            font-size: 100px; /* 原始默认值 */
            display: block; /* 默认显示 */
        }
        
        /* --- 样式 B: 极简时钟 --- */
        #clockB {
            color: #FFFFFF;
            font-family: sans-serif;
            font-weight: bold;
            display: none; /* 默认隐藏 */
            /* 使用 Flexbox 实现绝对居中，继承自第二个原始代码段的 body 样式 */
            height: 100%; 
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #clocktextB {
            font-kerning: none;
            line-height: 1; /* 优化行高 */
        }

        /* --- 控件样式 --- */
        #controls {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            opacity: 0.9;
            transition: opacity 0.3s;
        }
        button, select {
            font-size: 16px;
            padding: 5px 10px;
            margin: 0 3px;
            background-color: rgba(51, 51, 51, 0.7);
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            backdrop-filter: blur(2px);
        }
    </style>
</head>
<body onclick="showControls()">
    <div id="clockA"></div>
    
    <div id="clockB">
        <span id="clocktextB" style="font-kerning:none"></span>
    </div>

    <div id="controls">
        <button id="styleToggleBtn" onclick="toggleStyle()">切换样式: A</button>
        <button onclick="moveClock('up')">↑</button>
        <button onclick="moveClock('down')">↓</button>
        <button onclick="moveClock('left')">←</button>
        <button onclick="moveClock('right')">→</button>
        <button onclick="changeFontSize(-20)">-</button>
        <button onclick="changeFontSize(20)">+</button>
        <select id="fontSelect" onchange="changeFont()">
            <option value="'Impact', 'Arial Black', sans-serif">Impact</option>
            <option value="'Arial Black', sans-serif">Arial Black</option>
            <option value="'Verdana', sans-serif">Verdana</option>
            <option value="'Helvetica', sans-serif">Helvetica</option>
            <option value="'Georgia', serif">Georgia</option>
        </select>
        <button onclick="goFullscreen()">全屏</button>
    </div>

    <script>
        // --- 样式 A 变量 (恢复至原始代码默认值) ---
        var currentFontSize = 100;
        var positionX = 50;
        var positionY = 50;
        var selectedFont = "'Impact', 'Arial Black', sans-serif";
        var hideTimeout = null;
        var currentStyle = 'A'; // 默认样式 A
        
        // --- 样式 B 变量 (来自第二个代码段) ---
        let textElemB = document.getElementById("clocktextB");
        const targetWidth = 0.9;
        let curFontSizeB = 20;

        // 加载保存的设置
        function loadSettings() {
            if (localStorage.getItem('clockSettings')) {
                var settings = JSON.parse(localStorage.getItem('clockSettings'));
                currentFontSize = settings.fontSize || 100;
                positionX = settings.positionX || 50;
                positionY = settings.positionY || 50;
                selectedFont = settings.font || "'Impact', 'Arial Black', sans-serif";
                currentStyle = settings.style || 'A'; // 加载样式设置
                
                document.getElementById("fontSelect").value = selectedFont;
            }
            // 初始化显示样式
            if (currentStyle === 'B') {
                toggleStyle(true);
            } else {
                // 应用样式 A 的设置
                updatePosition();
                updateFont();
                document.getElementById("clockA").style.fontSize = currentFontSize + "px";
            }
            // 确保 controls 按钮状态正确
            document.getElementById('styleToggleBtn').textContent = `切换样式: ${currentStyle}`;
        }

        // 保存设置
        function saveSettings() {
            var settings = {
                fontSize: currentFontSize,
                positionX: positionX,
                positionY: positionY,
                font: selectedFont,
                style: currentStyle // 保存当前样式
            };
            localStorage.setItem('clockSettings', JSON.stringify(settings));
        }

        /* ------------------- 样式 A 功能 (恢复原始代码) ------------------- */
        
        function updateClockA() {
            var now = new Date();
            var hours = now.getHours();
            var minutes = now.getMinutes();
            hours = (hours < 10 ? "0" : "") + hours;
            minutes = (minutes < 10 ? "0" : "") + minutes;
            document.getElementById("clockA").innerHTML = hours + ":" + minutes;
        }

        // Lumia 635 兼容性的原始自适应逻辑 (仅在窗口大小变化时调用，且会覆盖手动调整)
        function adjustFontSize() {
            if (currentStyle === 'A') {
                var clock = document.getElementById("clockA");
                var screenWidth = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
                var screenHeight = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;
                var adjustedHeight = screenHeight - 100;
                currentFontSize = Math.min(screenWidth * 0.2, adjustedHeight * 0.95);
                clock.style.fontSize = currentFontSize + "px";
                updatePosition();
                saveSettings();
            }
        }

        function changeFontSize(delta) {
            if (currentStyle === 'A') {
                var clock = document.getElementById("clockA");
                currentFontSize += delta;
                if (currentFontSize < 20) currentFontSize = 20;
                // 原始代码中此处没有 screenHeight 限制，为保持一致性保留原始逻辑
                clock.style.fontSize = currentFontSize + "px";
                startHideTimer();
                saveSettings();
            }
        }

        function moveClock(direction) {
            if (currentStyle === 'A') {
                if (direction === 'up') positionY -= 5;
                if (direction === 'down') positionY += 5;
                if (direction === 'left') positionX -= 5;
                if (direction === 'right') positionX += 5;

                if (positionX < 0) positionX = 0;
                if (positionX > 100) positionX = 100;
                if (positionY < 0) positionY = 0;
                if (positionY > 100) positionY = 100;

                updatePosition();
                startHideTimer();
                saveSettings();
            }
        }

        function updatePosition() {
            var clock = document.getElementById("clockA");
            clock.style.left = positionX + "%";
            clock.style.top = positionY + "%";
        }

        function changeFont() {
            if (currentStyle === 'A') {
                var clock = document.getElementById("clockA");
                selectedFont = document.getElementById("fontSelect").value;
                clock.style.fontFamily = selectedFont;
                startHideTimer();
                saveSettings();
            }
        }
        
        function updateFont() {
            document.getElementById("clockA").style.fontFamily = selectedFont;
        }

        /* ------------------- 样式 B 功能 (恢复原始代码) ------------------- */

        function updateClockB() {
            const d = new Date();
            let s = "";
            s += (10 > d.getHours() ? "0" : "") + d.getHours() + ":";
            s += (10 > d.getMinutes() ? "0" : "") + d.getMinutes();
            textElemB.textContent = s;
        }

        function updateTextSizeB() {
             if (currentStyle === 'B') {
                for (let i = 0; 3 > i; i++) {
                    curFontSizeB *= targetWidth / (textElemB.offsetWidth / textElemB.parentNode.offsetWidth);
                    textElemB.style.fontSize = curFontSizeB + "pt";
                }
            }
        }
        
        /* ------------------- 通用控制功能 ------------------- */
        
        function toggleStyle(initialLoad = false) {
            const controls = document.getElementById("controls");
            const clockA = document.getElementById("clockA");
            const clockB = document.getElementById("clockB");
            const btn = document.getElementById('styleToggleBtn');
            const fontSelect = document.getElementById('fontSelect');

            if (!initialLoad) {
                 currentStyle = (currentStyle === 'A' ? 'B' : 'A');
            }

            if (currentStyle === 'B') {
                // 切换到样式 B (极简)
                clockA.style.display = 'none';
                clockB.style.display = 'flex'; // Flexbox 布局
                
                // 禁用样式 A 的特定控件
                fontSelect.disabled = true;
                controls.querySelectorAll('button:nth-child(2), button:nth-child(3), button:nth-child(4), button:nth-child(5), button:nth-child(6), button:nth-child(7)').forEach(b => b.disabled = true);
                
                updateClockB();
                updateTextSizeB();
                window.addEventListener("resize", updateTextSizeB);
            } else {
                // 切换回样式 A (可控制)
                clockA.style.display = 'block';
                clockB.style.display = 'none';
                
                // 启用样式 A 的特定控件
                fontSelect.disabled = false;
                controls.querySelectorAll('button:nth-child(2), button:nth-child(3), button:nth-child(4), button:nth-child(5), button:nth-child(6), button:nth-child(7)').forEach(b => b.disabled = false);

                // 重新应用样式 A 的设置
                updateClockA();
                updatePosition();
                document.getElementById("clockA").style.fontSize = currentFontSize + "px";
                window.removeEventListener("resize", updateTextSizeB); // 移除样式 B 的监听
                window.addEventListener("resize", adjustFontSize); // 恢复样式 A 的监听
            }
            
            btn.textContent = `切换样式: ${currentStyle}`;
            saveSettings();
            startHideTimer();
        }

        function startHideTimer() {
            var controls = document.getElementById("controls");
            controls.style.opacity = "0.9";
            if (hideTimeout) {
                clearTimeout(hideTimeout);
            }
            hideTimeout = setTimeout(function() {
                controls.style.opacity = "0.7"; // 恢复原始的 0.7 隐藏状态
            }, 3000);
        }

        function showControls() {
            var controls = document.getElementById("controls");
            controls.style.opacity = "0.9";
            startHideTimer();
        }

        function goFullscreen() {
            var element = document.documentElement;
            if (document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement) {
                document.exitFullscreen ? document.exitFullscreen() : 
                document.mozCancelFullScreen ? document.mozCancelFullScreen() : 
                document.webkitExitFullscreen ? document.webkitExitFullscreen() : 
                document.msExitFullscreen ? document.msExitFullscreen() : null;
            } else {
                element.requestFullscreen ? element.requestFullscreen() : 
                element.mozRequestFullScreen ? element.mozRequestFullScreen() : 
                element.webkitRequestFullScreen ? element.webkitRequestFullScreen() : 
                element.msRequestFullscreen ? element.msRequestFullscreen() : null;
            }
            
            var userAgent = navigator.userAgent.toLowerCase();
            var isWindowsPhone = userAgent.indexOf("windows phone") > -1;

            if (isWindowsPhone) {
                 window.scrollTo(0, 1);
                 alert("请手动向上滑动隐藏导航栏以获得更大显示空间。");
            }
            startHideTimer();
        }

        // 模拟用户活动以阻止锁屏
        function preventScreenLock() {
            window.scrollTo(0, window.scrollY === 0 ? 1 : 0);
        }

        // --- 初始化和循环 ---
        
        // 每分钟更新样式 A 的时间 (原始间隔 60000 毫秒)
        setInterval(updateClockA, 60000); 
        // 样式 B 的时间更新逻辑 (原始代码中的 setTimeout 已被替换为 setInterval)
        setInterval(updateClockB, 60000);
        
        // 每 10 秒模拟用户活动
        setInterval(preventScreenLock, 10000);
        
        // 页面加载时初始化
        loadSettings();
        
        // 确保启动时两个时钟都有值
        updateClockA();
        updateClockB();
        
        // 恢复原始代码中对 resize 事件的监听 (仅样式 A 依赖此自适应)
        window.onresize = adjustFontSize; 
    </script>
</body>
</html>
