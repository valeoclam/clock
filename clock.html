<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>手机全屏时钟</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #000;
            overflow: hidden;
            touch-action: manipulation;
        }
        #clock {
            color: #ffffff;
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-weight: 900;
            text-align: center;
            position: absolute;
            /* top, left, transform 将由 JS 控制 */
            transform: translate(-50%, -50%); 
            -ms-transform: translate(-50%, -50%); /* 针对 IE/Edge 的前缀 */
            white-space: nowrap;
            width: 100%;
            letter-spacing: -5px;
            box-sizing: border-box;
            user-select: none;
            font-size: 150px; /* 默认回退值 */
        }
        #controls {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            opacity: 0; /* 默认隐藏 */
            pointer-events: none; /* 默认禁用点击 */
            transition: opacity 0.3s;
        }
        button, select {
            font-size: 16px;
            padding: 5px 10px;
            margin: 0 3px;
            background-color: rgba(51, 51, 51, 0.7);
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            backdrop-filter: blur(2px);
        }
    </style>
</head>
<body onclick="showControls()">
    <div id="clock"></div>
    <div id="controls">
        <button onclick="moveClock('up')">↑</button>
        <button onclick="moveClock('down')">↓</button>
        <button onclick="moveClock('left')">←</button>
        <button onclick="moveClock('right')">→</button>
        <button onclick="changeFontSize(-10)">-</button>
        <button onclick="changeFontSize(10)">+</button>
        <select id="fontSelect" onchange="changeFont()">
            <option value="'Impact', 'Arial Black', sans-serif">Impact</option>
            <option value="'Arial Black', sans-serif">Arial Black</option>
            <option value="'Verdana', sans-serif">Verdana</option>
            <option value="'Helvetica', sans-serif">Helvetica</option>
            <option value="'Georgia', serif">Georgia</option>
            <option value="'Courier New', monospace">Courier New</option>
        </select>
        <button id="autoAdjustBtn" onclick="toggleAutoAdjust()">自适应: 开</button>
        <button onclick="goFullscreen()">全屏</button>
    </div>

    <script>
        // --- 版本号变量 ---
        const CURRENT_VERSION = "2025.12.08.01"; // 每次更新代码时手动修改此版本号
        // --------------------

        var currentFontSize = 150;
        var hideTimeout = null;
        var positionX = 50;
        var positionY = 50;
        var selectedFont = "'Impact', 'Arial Black', sans-serif";
        var isAutoAdjust = true; 

        // 加载保存的设置
        function loadSettings() {
            if (localStorage.getItem('clockSettings')) {
                var settings = JSON.parse(localStorage.getItem('clockSettings'));
                // 如果是手动模式，则加载保存的字体大小，否则在 autoAdjustFontSize 中计算
                currentFontSize = settings.fontSize || 150; 
                positionX = settings.positionX || 50;
                positionY = settings.positionY || 50;
                selectedFont = settings.font || "'Impact', 'Arial Black', sans-serif";
                isAutoAdjust = settings.isAutoAdjust === false ? false : true;
                document.getElementById("fontSelect").value = selectedFont;
            }
            
            toggleAutoAdjust(true); // 初始化按钮状态并应用字体大小/自适应逻辑
            updatePosition();
            updateFont();
        }

        // 保存设置
        function saveSettings() {
            var settings = {
                fontSize: currentFontSize,
                positionX: positionX,
                positionY: positionY,
                font: selectedFont,
                isAutoAdjust: isAutoAdjust
            };
            localStorage.setItem('clockSettings', JSON.stringify(settings));
        }

        function updateClock() {
            var now = new Date();
            var hours = now.getHours();
            var minutes = now.getMinutes();
            hours = (hours < 10 ? "0" : "") + hours;
            minutes = (minutes < 10 ? "0" : "") + minutes;
            document.getElementById("clock").innerHTML = hours + ":" + minutes;
        }

        // Lumia 635 兼容性修复后的自适应字体大小逻辑
        function autoAdjustFontSize() {
            if (!isAutoAdjust) return;
            
            var clock = document.getElementById("clock");
            var screenWidth = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
            var screenHeight = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;
            
            // **关键修复：恢复 Windows Phone 兼容性调整**
            // 减去 100px 是为了避开 Windows Phone 底部导航栏或修正其高度报告错误
            var adjustedHeight = screenHeight - 100; 
            
            // 根据原始代码的计算逻辑，确保数字在屏幕内可见
            var calculatedFontSize = Math.min(screenWidth * 0.2, adjustedHeight * 0.95);

            currentFontSize = calculatedFontSize; 
            clock.style.fontSize = currentFontSize + "px";
            updatePosition();
            saveSettings();
        }

        // 切换自适应模式
        function toggleAutoAdjust(initialLoad = false) {
            var button = document.getElementById("autoAdjustBtn");
            if (!initialLoad) {
                isAutoAdjust = !isAutoAdjust;
            }
            
            if (isAutoAdjust) {
                button.textContent = "自适应: 开";
                autoAdjustFontSize(); // 开启时立即执行一次自适应
                window.addEventListener('resize', autoAdjustFontSize); // 监听 resize
            } else {
                button.textContent = "自适应: 关";
                window.removeEventListener('resize', autoAdjustFontSize); // 停止监听 resize
                // 切换到手动模式时，应用 currentFontSize（可能是上次手动调整的值）
                document.getElementById("clock").style.fontSize = currentFontSize + "px";
            }
            saveSettings();
            startHideTimer();
        }

        // 手动调整字体大小
        function changeFontSize(delta) {
            var clock = document.getElementById("clock");
            if (isAutoAdjust) {
                isAutoAdjust = false; // 任何手动调整都会关闭自适应
                toggleAutoAdjust(true); // 更新按钮状态，但不是初始加载
            }
            
            currentFontSize += delta;
            if (currentFontSize < 20) currentFontSize = 20;

            // 限制最大字体大小
            var screenHeight = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;
            if (currentFontSize > screenHeight * 0.95) currentFontSize = screenHeight * 0.95; 

            clock.style.fontSize = currentFontSize + "px";
            startHideTimer();
            saveSettings();
        }

        function moveClock(direction) {
            const step = 2;
            if (direction === 'up') positionY -= step;
            if (direction === 'down') positionY += step;
            if (direction === 'left') positionX -= step;
            if (direction === 'right') positionX += step;

            positionX = Math.min(100, Math.max(0, positionX));
            positionY = Math.min(100, Math.max(0, positionY));

            updatePosition();
            startHideTimer();
            saveSettings();
        }

        function updatePosition() {
            var clock = document.getElementById("clock");
            clock.style.left = positionX + "%";
            clock.style.top = positionY + "%";
        }

        function updateFont() {
            var clock = document.getElementById("clock");
            clock.style.fontFamily = selectedFont;
        }

        function changeFont() {
            selectedFont = document.getElementById("fontSelect").value;
            updateFont();
            startHideTimer();
            saveSettings();
        }

        function startHideTimer() {
            var controls = document.getElementById("controls");
            if (hideTimeout) {
                clearTimeout(hideTimeout);
            }
            hideTimeout = setTimeout(function() {
                controls.style.opacity = "0";
                controls.style.pointerEvents = "none";
            }, 3000);
        }

        function showControls() {
            var controls = document.getElementById("controls");
            controls.style.opacity = "0.9";
            controls.style.pointerEvents = "auto";
            startHideTimer();
        }

        function goFullscreen() {
            var element = document.documentElement;
            // 兼容性全屏处理
            if (document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement) {
                // 退出全屏
                document.exitFullscreen ? document.exitFullscreen() : 
                document.mozCancelFullScreen ? document.mozCancelFullScreen() : 
                document.webkitExitFullscreen ? document.webkitExitFullscreen() : 
                document.msExitFullscreen ? document.msExitFullscreen() : null;
            } else {
                // 进入全屏
                element.requestFullscreen ? element.requestFullscreen() : 
                element.mozRequestFullScreen ? element.mozRequestFullScreen() : 
                element.webkitRequestFullScreen ? element.webkitRequestFullScreen() : 
                element.msRequestFullscreen ? element.msRequestFullscreen() : null;
            }
            startHideTimer();
        }
        
        // 模拟用户活动以阻止锁屏
        function preventScreenLock() {
            window.scrollTo(0, window.scrollY === 0 ? 1 : 0);
        }
        
        // --- 版本检查逻辑（需要服务器支持）---
        function checkLatestVersion() {
            // 请将此处替换为您服务器上托管的最新版本 JSON 文件路径
            const versionCheckUrl = 'https://yourdomain.com/clock_version.json?t=' + new Date().getTime(); 

            fetch(versionCheckUrl)
                .then(response => response.json())
                .then(data => {
                    const latestVersion = data.version;
                    if (latestVersion && latestVersion !== CURRENT_VERSION) {
                        alert(`时钟程序有新版本 (${latestVersion})，请刷新页面！您当前版本是 ${CURRENT_VERSION}`);
                    }
                })
                .catch(error => {
                    console.error('无法检查最新版本，可能网络不通或版本文件不存在:', error);
                });
        }
        
        // --- 初始化和循环 ---
        
        // 每分钟更新时间
        setInterval(updateClock, 60000);
        // 每 10 秒模拟用户活动
        setInterval(preventScreenLock, 10000);
        // 每 5 分钟检查一次版本更新
        setInterval(checkLatestVersion, 5 * 60 * 1000);
        
        // 页面加载时初始化
        loadSettings();
        updateClock();
        checkLatestVersion(); // 立即检查一次
    </script>
</body>
</html>
