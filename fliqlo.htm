<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fliqlo Final</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; color: #ddd;
            overflow: hidden; -ms-touch-action: none;
        }
        .container { display: table; width: 100%; height: 100%; }
        .clock-wrapper { 
            display: table-cell; 
            vertical-align: middle; 
            text-align: center; 
            padding: 0 5px;
        }

        /* 核心改进：限制容器，防止溢出 */
        .card {
            display: inline-block;
            background-color: #1a1a1a;
            border-radius: 6px;
            width: 21%;          /* 严格限制宽度 */
            height: 60vw;        /* 竖屏高度 */
            margin: 0 1%;
            position: relative;
            overflow: hidden;    /* 必须：切掉超出方框的文字 */
            
            /* 字体调整：使用较小的字号，预留边缘 */
            font-family: "Impact", sans-serif;
            font-size: 50vw;     
            line-height: 60vw;   /* 与高度一致实现垂直居中 */
            text-align: center;
        }

        /* 中间缝隙：稍微加粗，更有翻页感 */
        .card::after {
            content: "";
            position: absolute;
            top: 50%; left: 0;
            width: 100%; height: 3px;
            background: #000;
            z-index: 10;
            margin-top: -1px;
        }

        /* 横屏模式：Lumia 635 这种屏幕在横屏下效果最好 */
        @media screen and (orientation: landscape) {
            .card { 
                width: 20vh; 
                height: 65vh; 
                font-size: 55vh; 
                line-height: 65vh; 
                margin: 0 1.5vh;
            }
        }

        /* 控制按钮 */
        .btn {
            position: absolute; width: 45px; height: 45px;
            line-height: 45px; background: rgba(50, 50, 50, 0.5);
            border: 1px solid #555; color: #fff; 
            border-radius: 50%; text-align: center; z-index: 100;
            display: none; font-size: 20px;
        }
        #btn-minus { bottom: 8%; left: 8%; }
        #btn-plus { bottom: 8%; right: 8%; }
    </style>
</head>
<body onclick="showControls()">

    <div class="container">
        <div id="btn-minus" class="btn" onclick="changeSize(-2); event.stopPropagation();">−</div>
        <div id="btn-plus" class="btn" onclick="changeSize(2); event.stopPropagation();">+</div>
        
        <div class="clock-wrapper">
            <div class="card" id="h1">0</div>
            <div class="card" id="h2">0</div>
            <div class="card" id="m1">0</div>
            <div class="card" id="m2">0</div>
        </div>
    </div>

    <script type="text/javascript">
        var cards = ["h1", "h2", "m1", "m2"];
        var btns = document.getElementsByClassName("btn");
        var currentSize = 50; // 这里的单位是vw/vh
        var timer = null;

        function updateTime() {
            var now = new Date();
            var h = now.getHours(), m = now.getMinutes();
            h = (h < 10 ? "0" + h : h).toString();
            m = (m < 10 ? "0" + m : m).toString();

            document.getElementById("h1").innerText = h.charAt(0);
            document.getElementById("h2").innerText = h.charAt(1);
            document.getElementById("m1").innerText = m.charAt(0);
            document.getElementById("m2").innerText = m.charAt(1);
        }

        function showControls() {
            for(var i=0; i<btns.length; i++) btns[i].style.display = "block";
            if (timer) clearTimeout(timer);
            timer = setTimeout(function() {
                for(var i=0; i<btns.length; i++) btns[i].style.display = "none";
            }, 4000);
        }

        function changeSize(delta) {
            currentSize += delta;
            var unit = (window.innerWidth > window.innerHeight) ? "vh" : "vw";
            for(var i=0; i<cards.length; i++) {
                var el = document.getElementById(cards[i]);
                el.style.fontSize = currentSize + unit;
                // 同时微调高度以适配字号
                el.style.height = (currentSize + 10) + unit;
                el.style.lineHeight = (currentSize + 10) + unit;
            }
        }

        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
