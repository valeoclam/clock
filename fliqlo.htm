<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fliqlo Fix</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; color: #E5E5E5;
            overflow: hidden; -ms-touch-action: none;
            font-family: "Impact", "Segoe UI Black", sans-serif;
        }
        .container { display: table; width: 100%; height: 100%; }
        .clock-wrapper { display: table-cell; vertical-align: middle; text-align: center; }

        /* 单个数字卡片槽 */
        .card {
            display: inline-block;
            background-color: #1a1a1a;
            border-radius: 4px;
            width: 20%;      /* 四个卡片，每个约20% */
            margin: 0 1%;    /* 留出间隙 */
            padding: 10px 0;
            position: relative;
            font-size: 35vw; /* 调整字号 */
            line-height: 1.2;
            text-align: center;
        }

        /* 中间分割线 */
        .card::after {
            content: "";
            position: absolute;
            top: 50%; left: 0;
            width: 100%; height: 1px;
            background: #000;
            z-index: 5;
        }

        /* 针对 Lumia 横屏优化 */
        @media screen and (orientation: landscape) {
            .card { font-size: 70vh; width: 22vh; margin: 0 1vh; }
        }

        .btn {
            position: absolute; width: 50px; height: 50px;
            line-height: 50px; background: rgba(255, 255, 255, 0.1);
            border: 1px solid #444; color: #fff; 
            border-radius: 50%; text-align: center; z-index: 100;
            display: none; font-family: "Segoe UI", sans-serif;
        }
        #btn-minus { bottom: 5%; left: 5%; }
        #btn-plus { bottom: 5%; right: 5%; }
    </style>
</head>
<body onclick="showControls()">

    <div class="container">
        <div id="btn-minus" class="btn" onclick="changeSize(-2); event.stopPropagation();">-</div>
        <div id="btn-plus" class="btn" onclick="changeSize(2); event.stopPropagation();">+</div>
        
        <div class="clock-wrapper">
            <div class="card" id="h1">0</div><div class="card" id="h2">0</div>
            <span style="font-size: 10vw; vertical-align: middle; opacity: 0.5;"> </span>
            <div class="card" id="m1">0</div><div class="card" id="m2">0</div>
        </div>
    </div>

    <script type="text/javascript">
        var cards = ["h1", "h2", "m1", "m2"];
        var btns = document.getElementsByClassName("btn");
        var currentSize = 35;
        var timer = null;

        function updateTime() {
            var now = new Date();
            var h = now.getHours().toString();
            var m = now.getMinutes().toString();
            
            if (h.length < 2) h = "0" + h;
            if (m.length < 2) m = "0" + m;

            document.getElementById("h1").innerText = h.charAt(0);
            document.getElementById("h2").innerText = h.charAt(1);
            document.getElementById("m1").innerText = m.charAt(0);
            document.getElementById("m2").innerText = m.charAt(1);
        }

        function showControls() {
            for(var i=0; i<btns.length; i++) btns[i].style.display = "block";
            if (timer) clearTimeout(timer);
            timer = setTimeout(function() {
                for(var i=0; i<btns.length; i++) btns[i].style.display = "none";
            }, 4000);
        }

        function changeSize(delta) {
            currentSize += delta;
            var unit = (window.innerWidth > window.innerHeight) ? "vh" : "vw";
            for(var i=0; i<cards.length; i++) {
                var el = document.getElementById(cards[i]);
                el.style.fontSize = currentSize + unit;
                el.style.width = (window.innerWidth > window.innerHeight) ? (currentSize*0.6) + "vh" : "20%";
            }
        }

        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
