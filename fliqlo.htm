<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fliqlo Pro Custom</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden; -ms-touch-action: none;
        }
        #main-container {
            display: table; width: 100%; height: 100%;
            position: relative; top: 0px; left: 0px;
        }
        .clock-wrapper { display: table-cell; vertical-align: middle; text-align: center; }

        .card {
            display: inline-block;
            background-color: #1a1a1a;
            border-radius: 6px;
            width: 22vw; height: 65vw;
            margin: 0 1%;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }

        .num-text {
            position: absolute; width: 100%; height: 100%;
            top: 0; left: 0px; /* 初始偏移 */
            color: #dcdcdc;
            font-family: "Impact", "Segoe UI Black", sans-serif;
            font-size: 55vw; 
            line-height: 65vw;
            text-align: center;
            font-weight: 800; /* 初始加粗 */
            transform: scaleX(0.75); -ms-transform: scaleX(0.75);
        }

        .card::after {
            content: ""; position: absolute; top: 50%; left: 0;
            width: 100%; height: 2px; background: #000;
            z-index: 10; margin-top: -1px;
        }

        /* 控制面板优化：多行显示 */
        .controls {
            position: fixed; bottom: 3%; left: 0; width: 100%;
            text-align: center; z-index: 1000; display: none;
        }
        .btn {
            display: inline-block; width: 45px; height: 40px;
            line-height: 40px; background: rgba(40,40,40,0.9);
            border: 1px solid #666; color: #fff; border-radius: 4px;
            margin: 2px; font-size: 13px; font-family: "Segoe UI", sans-serif;
        }
        .btn-active { background: #555; border-color: #fff; }
    </style>
</head>
<body onclick="toggleControls()">

    <div id="main-container">
        <div class="clock-wrapper">
            <div class="card"><div class="num-text" id="h1">0</div></div>
            <div class="card"><div class="num-text" id="h2">0</div></div>
            <div class="card"><div class="num-text" id="m1">0</div></div>
            <div class="card"><div class="num-text" id="m2">0</div></div>
        </div>
    </div>

    <div id="ctrl-panel" class="controls">
        <div class="btn" onclick="adj('size', 2)">字+</div>
        <div class="btn" onclick="adj('size', -2)">字-</div>
        <div class="btn" onclick="adj('width', 2)">宽+</div>
        <div class="btn" onclick="adj('width', -2)">宽-</div>
        <div class="btn" onclick="adj('height', 2)">高+</div>
        <div class="btn" onclick="adj('height', -2)">高-</div>
        <br>
        <div class="btn" onclick="adj('offset', -2)">字←</div>
        <div class="btn" onclick="adj('offset', 2)">字→</div>
        <div class="btn" onclick="changeWeight()">粗/细</div>
        <div class="btn" onclick="adj('y', -10)">屏↑</div>
        <div class="btn" onclick="adj('y', 10)">屏↓</div>
        <div class="btn" onclick="location.reload()" style="background:#b33">重置</div>
    </div>

    <script type="text/javascript">
        var state = { size: 55, width: 22, height: 65, x: 0, y: 0, offset: 0, weight: 800 };
        var weights = [100, 400, 700, 900];
        var wIndex = 2;

        function updateTime() {
            var now = new Date();
            var h = ("0"+now.getHours()).slice(-2), m = ("0"+now.getMinutes()).slice(-2);
            document.getElementById("h1").innerText = h.charAt(0);
            document.getElementById("h2").innerText = h.charAt(1);
            document.getElementById("m1").innerText = m.charAt(0);
            document.getElementById("m2").innerText = m.charAt(1);
        }

        function adj(type, val) {
            event.stopPropagation();
            state[type] += val;
            var unit = (window.innerWidth > window.innerHeight) ? "vh" : "vw";
            
            var cards = document.getElementsByClassName("card");
            var nums = document.getElementsByClassName("num-text");
            var container = document.getElementById("main-container");

            for(var i=0; i<4; i++) {
                cards[i].style.width = state.width + unit;
                cards[i].style.height = state.height + unit;
                nums[i].style.fontSize = state.size + unit;
                nums[i].style.lineHeight = state.height + unit;
                nums[i].style.left = state.offset + "px"; // 调整文字左右位置
            }
            container.style.top = state.y + "px";
        }

        function changeWeight() {
            event.stopPropagation();
            wIndex = (wIndex + 1) % weights.length;
            var nums = document.getElementsByClassName("num-text");
            for(var i=0; i<4; i++) {
                nums[i].style.fontWeight = weights[wIndex];
            }
        }

        function toggleControls() {
            var p = document.getElementById("ctrl-panel");
            p.style.display = (p.style.display == "block") ? "none" : "block";
        }

        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
