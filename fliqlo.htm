<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fliqlo Custom</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden; -ms-touch-action: none;
        }
        /* 外层容器支持平移位置调整 */
        #main-container {
            display: table; width: 100%; height: 100%;
            position: relative; top: 0px; left: 0px;
        }
        .clock-wrapper { display: table-cell; vertical-align: middle; text-align: center; }

        .card {
            display: inline-block;
            background-color: #1a1a1a;
            border-radius: 6px;
            width: 22vw;         /* 初始宽度 */
            height: 65vw;        /* 初始高度 */
            margin: 0 1%;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }

        .num-text {
            position: absolute; width: 100%; height: 100%;
            top: 0; left: 0; color: #dcdcdc;
            font-family: "Impact", sans-serif;
            font-size: 55vw;    /* 初始字号 */
            line-height: 65vw;  /* 需与高度保持一致 */
            text-align: center;
            transform: scaleX(0.75); -ms-transform: scaleX(0.75);
        }

        .card::after {
            content: ""; position: absolute; top: 50%; left: 0;
            width: 100%; height: 2px; background: #000;
            z-index: 10; margin-top: -1px;
        }

        /* 控制面板样式 */
        .controls {
            position: fixed; bottom: 5%; left: 0; width: 100%;
            text-align: center; z-index: 1000; display: none;
        }
        .btn {
            display: inline-block; width: 42px; height: 42px;
            line-height: 42px; background: rgba(50,50,50,0.8);
            border: 1px solid #777; color: #fff; border-radius: 5px;
            margin: 2px; font-size: 14px; font-family: sans-serif;
        }
    </style>
</head>
<body onclick="toggleControls()">

    <div id="main-container">
        <div class="clock-wrapper">
            <div class="card"><div class="num-text" id="h1">0</div></div>
            <div class="card"><div class="num-text" id="h2">0</div></div>
            <div class="card"><div class="num-text" id="m1">0</div></div>
            <div class="card"><div class="num-text" id="m2">0</div></div>
        </div>
    </div>

    <div id="ctrl-panel" class="controls">
        <div class="btn" onclick="adj('size', 2)">字+</div>
        <div class="btn" onclick="adj('size', -2)">字-</div>
        <div class="btn" onclick="adj('width', 2)">宽+</div>
        <div class="btn" onclick="adj('width', -2)">宽-</div>
        <div class="btn" onclick="adj('height', 2)">高+</div>
        <div class="btn" onclick="adj('height', -2)">高-</div>
        <br>
        <div class="btn" onclick="adj('y', -5)">↑</div>
        <div class="btn" onclick="adj('y', 5)">↓</div>
        <div class="btn" onclick="adj('x', -5)">←</div>
        <div class="btn" onclick="adj('x', 5)">→</div>
        <div class="btn" onclick="location.reload()" style="background:#444">重置</div>
    </div>

    <script type="text/javascript">
        var state = { size: 55, width: 22, height: 65, x: 0, y: 0 };
        var ids = ["h1", "h2", "m1", "m2"];
        var timer = null;

        function updateTime() {
            var now = new Date();
            var h = ("0"+now.getHours()).slice(-2), m = ("0"+now.getMinutes()).slice(-2);
            document.getElementById("h1").innerText = h.charAt(0);
            document.getElementById("h2").innerText = h.charAt(1);
            document.getElementById("m1").innerText = m.charAt(0);
            document.getElementById("m2").innerText = m.charAt(1);
        }

        function adj(type, val) {
            event.stopPropagation();
            state[type] += val;
            var unit = (window.innerWidth > window.innerHeight) ? "vh" : "vw";
            
            var cards = document.getElementsByClassName("card");
            var nums = document.getElementsByClassName("num-text");
            var container = document.getElementById("main-container");

            for(var i=0; i<4; i++) {
                cards[i].style.width = state.width + unit;
                cards[i].style.height = state.height + unit;
                nums[i].style.fontSize = state.size + unit;
                nums[i].style.lineHeight = state.height + unit; // 保持文字垂直居中
            }
            container.style.top = state.y + "px";
            container.style.left = state.x + "px";
        }

        function toggleControls() {
            var p = document.getElementById("ctrl-panel");
            p.style.display = (p.style.display == "block") ? "none" : "block";
        }

        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
