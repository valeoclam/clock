<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fliqlo Ultra</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden; -ms-touch-action: none;
        }
        .container { display: table; width: 100%; height: 100%; }
        .clock-wrapper { display: table-cell; vertical-align: middle; text-align: center; }

        /* 卡片容器 */
        .card {
            display: inline-block;
            background-color: #1a1a1a;
            border-radius: 6px;
            width: 20%;          /* 容器宽度占屏幕1/5 */
            height: 65vw;        /* 竖屏高度 */
            margin: 0 1.5%;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
        }

        /* 数字层：关键在于 scaleX 压缩 */
        .num-text {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0; left: 0;
            color: #dcdcdc;
            font-family: "Impact", sans-serif;
            font-size: 55vw; 
            line-height: 65vw;
            text-align: center;
            /* 强制将数字宽度压缩到原来的 0.7 倍，实现瘦长感 */
            transform: scaleX(0.7);
            -ms-transform: scaleX(0.7); 
        }

        /* 中间缝隙 */
        .card::after {
            content: "";
            position: absolute;
            top: 50%; left: 0;
            width: 100%; height: 2px;
            background: #000;
            z-index: 10;
            margin-top: -1px;
            opacity: 0.8;
        }

        /* 横屏模式优化 */
        @media screen and (orientation: landscape) {
            .card { width: 18vh; height: 60vh; margin: 0 1.5vh; }
            .num-text { font-size: 52vh; line-height: 60vh; }
        }

        /* 调试按钮 */
        .btn {
            position: absolute; width: 40px; height: 40px;
            line-height: 40px; background: rgba(255, 255, 255, 0.1);
            border: 1px solid #333; color: #666; 
            border-radius: 50%; text-align: center; z-index: 100;
            display: none; font-size: 16px;
        }
        #btn-minus { bottom: 5%; left: 5%; }
        #btn-plus { bottom: 5%; right: 5%; }
    </style>
</head>
<body onclick="showControls()">

    <div class="container">
        <div id="btn-minus" class="btn" onclick="changeSize(-2); event.stopPropagation();">−</div>
        <div id="btn-plus" class="btn" onclick="changeSize(2); event.stopPropagation();">+</div>
        
        <div class="clock-wrapper">
            <div class="card"><div class="num-text" id="h1">0</div></div>
            <div class="card"><div class="num-text" id="h2">0</div></div>
            <div class="card"><div class="num-text" id="m1">0</div></div>
            <div class="card"><div class="num-text" id="m2">0</div></div>
        </div>
    </div>

    <script type="text/javascript">
        var ids = ["h1", "h2", "m1", "m2"];
        var btns = document.getElementsByClassName("btn");
        var currentSize = 55;
        var timer = null;

        function updateTime() {
            var now = new Date();
            var h = now.getHours(), m = now.getMinutes();
            h = (h < 10 ? "0" + h : h).toString();
            m = (m < 10 ? "0" + m : m).toString();

            document.getElementById("h1").innerText = h.charAt(0);
            document.getElementById("h2").innerText = h.charAt(1);
            document.getElementById("m1").innerText = m.charAt(0);
            document.getElementById("m2").innerText = m.charAt(1);
        }

        function showControls() {
            for(var i=0; i<btns.length; i++) btns[i].style.display = "block";
            if (timer) clearTimeout(timer);
            timer = setTimeout(function() {
                for(var i=0; i<btns.length; i++) btns[i].style.display = "none";
            }, 3000);
        }

        function changeSize(delta) {
            currentSize += delta;
            var unit = (window.innerWidth > window.innerHeight) ? "vh" : "vw";
            for(var i=0; i<ids.length; i++) {
                var el = document.getElementById(ids[i]);
                el.style.fontSize = currentSize + unit;
            }
        }

        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
