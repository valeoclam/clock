<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>手机全屏时钟</title>
    <style>
        /* 1. 基础设置：全屏、黑底、隐藏滚动条 */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #000;
            overflow: hidden;
        }
        /* 2. 时钟样式：居中、大字、粗体、白色 */
        #clock {
            color: #ffffff;
            /* 选用更粗、更宽的字体 */
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-weight: 900;
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            white-space: nowrap;
            width: 100%;
            /* font-size 将通过 JS 动态设置 */
            font-size: 100px;
            letter-spacing: -5px;
        }
        /* 3. 控制按钮样式：底部居中、透明度、层级 */
        #controls {
            position: fixed; /* 使用 fixed 确保在视图内 */
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            opacity: 0.7;
            transition: opacity 0.5s; /* 添加淡入淡出效果 */
        }
        button {
            font-size: 25px;
            padding: 5px 15px;
            margin: 0 5px;
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="clock"></div>
    <div id="controls">
        <button onclick="changeFontSize(-20)">-</button>
        <button onclick="changeFontSize(20)">+</button>
    </div>

    <script>
        const clockElement = document.getElementById("clock");
        const controlsElement = document.getElementById("controls");
        let currentFontSize = 100; // 初始化字号
        let hideTimeout = null;

        /**
         * 更新时钟显示的时间（小时:分钟）
         */
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            clockElement.textContent = `${hours}:${minutes}`;
        }

        /**
         * 自动调整字号以适应屏幕（优先适应高度）
         */
        function adjustFontSize() {
            const screenHeight = window.innerHeight;
            const screenWidth = window.innerWidth;
            
            // 采用屏幕高度的百分比作为基准，同时不超过宽度
            // 0.95 确保内容不会顶到屏幕边缘
            const maxHeightBasedSize = screenHeight * 0.95; 
            // 限制字号不超过屏幕宽度的某个比例（例如 25% * 4 个字符 = 100% 宽度）
            const maxWidthBasedSize = screenWidth * 0.25; 

            // 取两者较小值以确保时间能完全显示在屏幕上
            currentFontSize = Math.min(maxHeightBasedSize, maxWidthBasedSize); 
            // 确保字号在合理范围内
            currentFontSize = Math.max(currentFontSize, 20); 

            clockElement.style.fontSize = `${currentFontSize}px`;
        }

        /**
         * 手动调整字号，并在一段时间后隐藏控制按钮
         * @param {number} delta 字体大小的增量
         */
        function changeFontSize(delta) {
            // 1. 停止自动调整，将当前字号设置为手动调整后的值
            currentFontSize = parseFloat(clockElement.style.fontSize) || 100;
            currentFontSize += delta;

            // 2. 限制字号的最小和最大值
            const MIN_SIZE = 20;
            const MAX_SIZE = 500; // 适当放宽最大值以适应更高分辨率
            currentFontSize = Math.min(Math.max(currentFontSize, MIN_SIZE), MAX_SIZE);
            
            // 3. 更新显示
            clockElement.style.fontSize = `${currentFontSize}px`;

            // 4. 显示控制按钮
            controlsElement.style.display = "block";
            controlsElement.style.opacity = 0.7;

            // 5. 重置隐藏定时器
            if (hideTimeout) {
                clearTimeout(hideTimeout);
            }
            hideTimeout = setTimeout(function() {
                controlsElement.style.opacity = 0; // 淡出
                setTimeout(() => {
                    if(controlsElement.style.opacity == 0) {
                        controlsElement.style.display = "none"; // 彻底隐藏
                    }
                }, 500); // 0.5秒后隐藏
            }, 3000); // 3秒后开始隐藏
        }

        // --- 初始化和事件绑定 ---

        // 首次加载和屏幕尺寸变化时：自动调整字号
        adjustFontSize();
        window.addEventListener('resize', adjustFontSize);

        // 首次加载时：更新时间
        updateClock();

        // 注册定时器：每分钟更新一次时间
        setInterval(updateClock, 60000);
        
        // 触摸屏幕时，显示控制按钮
        document.body.addEventListener('touchstart', function() {
            controlsElement.style.display = "block";
            controlsElement.style.opacity = 0.7;
            changeFontSize(0); // 调用 changeFontSize 来设置定时器隐藏按钮
        });
        
    </script>
</body>
</html>
