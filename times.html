<script type="text/javascript">
    var clockEl = document.getElementById("clock");
    var currentFontSize = 30; // 初始 vw 值
    var lastDist = 0;

    function updateTime() {
        var now = new Date();
        var h = now.getHours();
        var m = now.getMinutes();
        h = h < 10 ? "0" + h : h;
        m = m < 10 ? "0" + m : m;
        clockEl.innerText = h + ":" + m;
    }

    // 处理触摸缩放
    document.addEventListener('touchmove', function(e) {
        if (e.touches.length === 2) {
            // 计算两个手指间的距离
            var dist = Math.sqrt(
                Math.pow(e.touches[0].pageX - e.touches[1].pageX, 2) +
                Math.pow(e.touches[0].pageY - e.touches[1].pageY, 2)
            );

            if (lastDist > 0) {
                // 根据距离变化调整字体大小
                var delta = (dist - lastDist) / 10;
                currentFontSize += delta;
                
                // 限制最小和最大尺寸
                if (currentFontSize < 10) currentFontSize = 10;
                if (currentFontSize > 90) currentFontSize = 90;
                
                clockEl.style.fontSize = currentFontSize + "vw";
            }
            lastDist = dist;
            e.preventDefault(); // 阻止浏览器默认缩放行为
        }
    }, { passive: false });

    document.addEventListener('touchend', function(e) {
        lastDist = 0; // 手指离开时重置距离记录
    });

    // 初始点击切换功能保留
    function toggleSize() {
        currentFontSize = (currentFontSize === 30) ? 45 : 30;
        clockEl.style.fontSize = currentFontSize + (window.innerWidth > window.innerHeight ? "vh" : "vw");
    }

    setInterval(updateTime, 1000);
    updateTime();

    window.onresize = function() {
        updateTime();
    };
</script>
