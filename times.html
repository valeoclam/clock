<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lumia Pro Clock</title>
    <style>
    body, html {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background-color: #000000; color: #ffffff;
        overflow: hidden; 
        /* 1. 默认使用 Segoe UI Black，这是 WP 上最粗的系统字体 */
        font-family: "Segoe UI Black", "Segoe UI", sans-serif;
        -ms-touch-action: none;
    }
    .container { display: table; width: 100%; height: 100%; position: relative; }
    .clock-wrapper { display: table-cell; vertical-align: middle; text-align: center; }
    
    #clock {
        /* 2. 初始字体设大，并压缩行高以减少上下留空 */
        font-size: 45vw; 
        font-weight: 900;
        line-height: 0.8; 
        display: inline-block;
        letter-spacing: -2px; /* 缩小数字间距，更显饱满 */
    }

    /* 3. 横屏下进一步放大 */
    @media screen and (orientation: landscape) {
        #clock { font-size: 75vh; }
    }

    .btn {
        position: absolute; bottom: 10%; width: 60px; height: 60px;
        line-height: 55px; background: rgba(255, 255, 255, 0.2);
        border: 2px solid #fff; color: #fff; border-radius: 50%;
        text-align: center; font-size: 40px; z-index: 100;
        display: none;
    }
    #btn-minus { left: 10%; }
    #btn-plus { right: 10%; }
</style>
</head>
<body onclick="showControls()">

    <div class="container">
        <div id="btn-minus" class="btn" onclick="changeSize(-5); event.stopPropagation();">-</div>
        <div id="btn-plus" class="btn" onclick="changeSize(5); event.stopPropagation();">+</div>
        
        <div class="clock-wrapper">
            <div id="clock">00:00</div>
        </div>
    </div>

    <script type="text/javascript">
        var clockEl = document.getElementById("clock");
        var btnMinus = document.getElementById("btn-minus");
        var btnPlus = document.getElementById("btn-plus");
        var currentSize = 40;
        var timer = null;

        function updateTime() {
            var now = new Date();
            var h = now.getHours();
            var m = now.getMinutes();
            h = (h < 10) ? "0" + h : h;
            m = (m < 10) ? "0" + m : m;
            clockEl.innerText = h + ":" + m;
        }

        function showControls() {
            // 显示按钮
            btnMinus.style.display = "block";
            btnPlus.style.display = "block";
            
            // 如果已有定时器则清除，重新计时
            if (timer) clearTimeout(timer);
            
            // 5秒后隐藏
            timer = setTimeout(function() {
                btnMinus.style.display = "none";
                btnPlus.style.display = "none";
            }, 5000);
        }

        function changeSize(delta) {
            currentSize += delta;
            if (currentSize < 10) currentSize = 10;
            if (currentSize > 150) currentSize = 150;
            
            var unit = (window.innerWidth > window.innerHeight) ? "vh" : "vw";
            clockEl.style.fontSize = currentSize + unit;
            
            // 点击按钮时刷新隐藏时间
            showControls();
        }

        setInterval(updateTime, 1000);
        updateTime();
        window.onresize = function() { updateTime(); };
    </script>
</body>
</html>
