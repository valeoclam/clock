<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lumia Custom Clock</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000000; color: #ffffff;
            overflow: hidden; -ms-touch-action: none;
        }
        .container { display: table; width: 100%; height: 100%; position: relative; }
        .clock-wrapper { display: table-cell; vertical-align: middle; text-align: center; }
        
        #clock {
            /* 初始设为细体 */
            font-family: "Segoe UI Light", sans-serif;
            font-size: 45vw; 
            font-weight: 100; 
            line-height: 1; 
            display: inline-block;
            transition: transform 0.2s; /* 增加平滑过渡效果 */
        }

        @media screen and (orientation: landscape) {
            #clock { font-size: 80vh; }
        }

        /* 按钮样式 */
        .btn {
            position: absolute; width: 55px; height: 55px;
            line-height: 52px; background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.5); color: #fff; 
            border-radius: 50%; text-align: center; z-index: 100;
            display: none; -ms-user-select: none; font-family: "Segoe UI", sans-serif;
        }
        #btn-minus { bottom: 10%; left: 5%; font-size: 35px; }
        #btn-plus { bottom: 10%; right: 5%; font-size: 35px; }
        #btn-font { top: 8%; left: 8%; font-size: 18px; }
        #btn-stretch { top: 8%; right: 8%; font-size: 25px; }
    </style>
</head>
<body onclick="showControls()">

    <div class="container">
        <div id="btn-font" class="btn" onclick="changeFont(); event.stopPropagation();">字体</div>
        <div id="btn-stretch" class="btn" onclick="changeStretch(); event.stopPropagation();">↕</div>
        <div id="btn-minus" class="btn" onclick="changeSize(-5); event.stopPropagation();">-</div>
        <div id="btn-plus" class="btn" onclick="changeSize(5); event.stopPropagation();">+</div>
        
        <div class="clock-wrapper">
            <div id="clock">00:00</div>
        </div>
    </div>

    <script type="text/javascript">
        var clockEl = document.getElementById("clock");
        var btns = document.getElementsByClassName("btn");
        var currentSize = 45;
        var currentStretch = 1.0;
        var timer = null;

        // 扩充更多风格字体：细体、窄体、现代体
        var fonts = [
            '"Segoe UI Light", sans-serif',      // 纤细
            '"Segoe UI Semilight", sans-serif', // 适中
            '"Impact", sans-serif',             // 极窄（虽然厚但非常高瘦）
            '"Calibri Light", sans-serif',      // 现代
            '"Arial", sans-serif'               // 标准
        ];
        var fontIndex = 0;

        function updateTime() {
            var now = new Date();
            var h = now.getHours(), m = now.getMinutes();
            // 强制半角冒号
            clockEl.innerText = (h < 10 ? "0"+h : h) + ":" + (m < 10 ? "0"+m : m);
        }

        function showControls() {
            for(var i=0; i<btns.length; i++) btns[i].style.display = "block";
            if (timer) clearTimeout(timer);
            timer = setTimeout(function() {
                for(var i=0; i<btns.length; i++) btns[i].style.display = "none";
            }, 5000);
        }

        function changeSize(delta) {
            currentSize += delta;
            if (currentSize < 10) currentSize = 10;
            var unit = (window.innerWidth > window.innerHeight) ? "vh" : "vw";
            clockEl.style.fontSize = currentSize + unit;
            showControls();
        }

        function changeFont() {
            fontIndex = (fontIndex + 1) % fonts.length;
            clockEl.style.fontFamily = fonts[fontIndex];
            // 针对 Impact 这种极窄字体，默认不拉长
            if(fontIndex === 2) currentStretch = 1.0;
            applyTransform();
            showControls();
        }

        // 新增拉长逻辑：通过 scaleY 纵向拉伸
        function changeStretch() {
            currentStretch += 0.2;
            if (currentStretch > 2.0) currentStretch = 1.0; // 循环：1.0 -> 1.2 -> 1.4... -> 1.0
            applyTransform();
            showControls();
        }

        function applyTransform() {
            clockEl.style.msTransform = "scaleY(" + currentStretch + ")";
            clockEl.style.transform = "scaleY(" + currentStretch + ")";
        }

        setInterval(updateTime, 1000);
        updateTime();
        window.onresize = function() { updateTime(); };
    </script>
</body>
</html>
