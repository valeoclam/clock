<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Lumia Landscape Clock</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            overflow: hidden;
            font-family: "Segoe UI", sans-serif;
        }

        /* 核心容器：确保在任何方向都绝对居中 */
        .flex-container {
            display: table; /* 使用 table 布局确保旧版 IE 兼容性 */
            width: 100%;
            height: 100%;
        }

        .clock-wrapper {
            display: table-cell;
            vertical-align: middle;
            text-align: center;
        }

        #clock {
            /* 响应式字体大小：取屏幕宽度和高度中较小值的 35% */
            font-size: 30vw; 
            font-weight: bold;
            line-height: 1;
            display: inline-block;
            /* 增加一点文字阴影，防止老旧屏幕偏色 */
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        /* 横屏模式下的字体调整 */
        @media screen and (orientation: landscape) {
            #clock {
                font-size: 45vh; /* 横屏时根据高度缩放，避免数字超出屏幕 */
            }
        }

        /* 隐藏控制按钮，点击屏幕任意位置可微调大小 */
        .hint {
            position: absolute;
            bottom: 5px;
            width: 100%;
            text-align: center;
            color: #333;
            font-size: 12px;
        }
    </style>
</head>
<body onclick="toggleSize()">

    <div class="flex-container">
        <div class="clock-wrapper">
            <div id="clock">00:00</div>
        </div>
    </div>

    <div class="hint">点击屏幕切换大小</div>

    <script type="text/javascript">
        function updateTime() {
            var now = new Date();
            var h = now.getHours();
            var m = now.getMinutes();
            
            h = h < 10 ? "0" + h : h;
            m = m < 10 ? "0" + m : m;
            
            document.getElementById("clock").innerText = h + ":" + m;
        }

        // 简单的点击切换大小功能，防止某些特殊情况下字体过大或过小
        var isLarge = true;
        function toggleSize() {
            var el = document.getElementById("clock");
            if(isLarge) {
                el.style.fontSize = '25vw';
            } else {
                el.style.fontSize = ''; // 恢复 CSS 默认
            }
            isLarge = !isLarge;
        }

        setInterval(updateTime, 1000);
        updateTime();

        // 监听旋转事件（针对旧版 IE）
        window.onresize = function() {
            updateTime();
        };
    </script>
</body>
</html>
