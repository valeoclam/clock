<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Flip Clock with Date</title>
    <style>
        body { background-color: #0e0e0e; color: #d1d1d1; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; overflow: hidden; }
        #time { font-size: 15vw; font-weight: bold; letter-spacing: -2px; }
        #date { font-size: 3vw; margin-top: 20px; color: #888; text-transform: uppercase; letter-spacing: 5px; }
    </style>
</head>
<body>
    <div id="time">00:00</div>
    <div id="date">JANUARY 01, 2026</div>

    <script>
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            
            document.getElementById('time').textContent = h + ":" + m;
            document.getElementById('date').textContent = now.toLocaleDateString('zh-CN', options);
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
